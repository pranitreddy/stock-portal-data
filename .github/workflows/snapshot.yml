name: daily-snapshot
on:
  schedule:
    - cron: "40 11 * * 1-5"
    - cron: "40 12 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-portal-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: mkdir -p data && python fetch_snapshot.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Commit snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
